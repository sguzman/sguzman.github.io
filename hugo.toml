baseURL = "https://sguzman.github.io/"
languageCode = "en-us"
title = "Salvador Guzman"
theme = "coder"

[params]
avatarURL = "/images/avatar.png?v=20260424"
customCSS = ["css/custom.css"]

[menus]
[[menus.main]]
name = "Home"
pageRef = "/"
weight = 1

[[menus.main]]
name = "About"
pageRef = "/about"
weight = 5

[[menus.main]]
name = "Projects"
pageRef = "/projects"
weight = 10





[[menus.main]]
name = "Contact"
pageRef = "/contact"
weight = 20

[[menus.main]]
name = "Search"
pageRef = "/search"
weight = 40

# Enable JSON output so Hugo can emit a search index file (you provide the template).
# Hugo supports outputs per "page kind" (home/section/page/etc.). :contentReference[oaicite:2]{index=2}
[outputs]
home = ["html", "rss", "json"]
# Optional: if you want per-section JSON too (often unnecessary)
# section = ["html", "rss", "json"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
