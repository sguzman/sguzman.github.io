{{ define "title" }}
  {{ title (i18n (lower .Title)) | default .Title }} · {{ .Site.Title }}
{{ end }}

{{ define "content" }}
  <section class="container page">
    <article>
      <header>
        <h1 class="title">
          <a class="title-link" href="{{ .Permalink | safeURL }}">
            {{ title (i18n (lower .Title)) | default .Title }}
          </a>
        </h1>
      </header>
      {{ .Content }}
    </article>
  </section>
  <script defer src="/js/projects.js"></script>
{{ end }}
